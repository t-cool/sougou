<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>過去の取組 - ふるさと学習</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-6">

    <!-- 操作ナビゲーションバー -->
    <header class="no-print max-w-[900px] mx-auto mb-6 bg-white p-3.5 md:p-4 rounded-xl border border-slate-300 shadow-xs flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
            <a href="../index.html" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded text-sm transition flex items-center gap-2 border border-slate-300">
                <i class="fa-solid fa-arrow-left text-xs text-slate-500"></i>
                <i class="fa-solid fa-house text-slate-600"></i>
                <span>目次へ戻る</span>
            </a>
            <span class="text-slate-300">|</span>
            <div class="text-xs md:text-sm font-bold text-slate-700">
                ふるさと学習 アーカイブ
            </div>
        </div>
        <div class="flex items-center gap-2 flex-wrap text-sm">
            <a href="../plan/plan.html" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded text-xs md:text-sm transition border border-slate-300">
                全体計画
            </a>
            <a href="../obi/obi.html" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded text-xs md:text-sm transition border border-slate-300">
                帯活動資料
            </a>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-[900px] mx-auto space-y-6">

        <!-- ページ見出しカード -->
        <section class="bg-white p-6 md:p-8 rounded-xl border border-slate-300 shadow-xs">
            <div class="border-b border-slate-200 pb-3 mb-4 flex items-center justify-between flex-wrap gap-2">
                <div>
                    <span class="text-xs font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-2.5 py-0.5 rounded">
                        アーカイブ
                    </span>
                    <h1 class="text-xl md:text-2xl font-bold text-slate-900 mt-1.5">
                        過去の取組
                    </h1>
                </div>
            </div>
            <p class="text-sm text-slate-600 leading-relaxed">
                これまでに実践されたふるさと学習（総合的な学習の時間）のテーマや過去の実践・資料などをまとめています。
            </p>
        </section>

        <!-- 資料一覧・プレースホルダー -->
        <section class="bg-white p-6 md:p-8 rounded-xl border border-slate-300 shadow-xs">
            <h2 class="text-base md:text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-folder-open text-amber-500"></i>
                <span>スライド・資料一覧</span>
            </h2>

            <div class="p-8 text-center border-2 border-dashed border-slate-200 rounded-xl bg-slate-50/50">
                <i class="fa-solid fa-file-powerpoint text-slate-300 text-4xl mb-3"></i>
                <div class="font-medium text-slate-600 text-sm mb-1">
                    資料準備中
                </div>
                <p class="text-xs text-slate-400">
                    今後、kako フォルダ内に過去のスライド資料やまとめPDFを追加・整理していく予定です。
                </p>
            </div>
        </section>

    </main>

</body>
</html>
