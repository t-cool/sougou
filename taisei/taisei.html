<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研究体制 - ふるさと学習</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-6">

    <!-- 操作ナビゲーションバー -->
    <header class="no-print max-w-[900px] mx-auto mb-6 bg-white p-3.5 md:p-4 rounded-xl border border-slate-300 shadow-xs flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
            <a href="../index.html" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded text-sm transition flex items-center gap-2 border border-slate-300">
                <i class="fa-solid fa-arrow-left text-xs text-slate-500"></i>
                <i class="fa-solid fa-house text-slate-600"></i>
                <span>目次</span>
            </a>
            <span class="text-slate-300">|</span>
            <div class="text-xs md:text-sm font-bold text-slate-700">
                ふるさと学習 研究体制
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-[900px] mx-auto space-y-6">

        <!-- ページ見出しカード -->
        <section class="bg-white p-6 md:p-8 rounded-xl border border-slate-300 shadow-xs">
            <div class="border-b border-slate-200 pb-3 mb-4 flex items-center justify-between flex-wrap gap-2">
                <div>
                    <span class="text-xs font-bold text-teal-700 bg-teal-50 border border-teal-200 px-2.5 py-0.5 rounded">
                        校内研究体制
                    </span>
                    <h1 class="text-xl md:text-2xl font-bold text-slate-900 mt-1.5">
                        研究体制
                    </h1>
                </div>
            </div>
            <p class="text-sm text-slate-600 leading-relaxed">
                三部会による校内研究体制についてまとめるページです。
            </p>
        </section>

        <!-- 三部会構成カード（枠組み） -->
        <section class="bg-white p-6 md:p-8 rounded-xl border border-slate-300 shadow-xs">
            <h2 class="text-base md:text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-sitemap text-teal-600"></i>
                <span>三部会の構成</span>
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- 天部会 -->
                <div class="p-5 rounded-xl border border-slate-200 bg-slate-50/50 flex flex-col">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="w-7 h-7 rounded-lg bg-sky-100 text-sky-700 font-bold flex items-center justify-center text-sm">天</span>
                        <h3 class="font-bold text-slate-900 text-base">天部会</h3>
                    </div>
                    <p class="text-xs text-slate-500 leading-relaxed flex-1">
                        部会の役割や対象学年、主な研究内容をここに記載します。
                    </p>
                </div>

                <!-- 木部会 -->
                <div class="p-5 rounded-xl border border-slate-200 bg-slate-50/50 flex flex-col">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="w-7 h-7 rounded-lg bg-emerald-100 text-emerald-700 font-bold flex items-center justify-center text-sm">木</span>
                        <h3 class="font-bold text-slate-900 text-base">木部会</h3>
                    </div>
                    <p class="text-xs text-slate-500 leading-relaxed flex-1">
                        部会の役割や対象学年、主な研究内容をここに記載します。
                    </p>
                </div>

                <!-- 川部会 -->
                <div class="p-5 rounded-xl border border-slate-200 bg-slate-50/50 flex flex-col">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="w-7 h-7 rounded-lg bg-blue-100 text-blue-700 font-bold flex items-center justify-center text-sm">川</span>
                        <h3 class="font-bold text-slate-900 text-base">川部会</h3>
                    </div>
                    <p class="text-xs text-slate-500 leading-relaxed flex-1">
                        部会の役割や対象学年、主な研究内容をここに記載します。
                    </p>
                </div>
            </div>
        </section>

    </main>

</body>
</html>
